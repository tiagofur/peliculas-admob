plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '2'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.1'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def defaultKeystorePath = 'C:/src/peliculas.jks'
def resolvedKeystorePath = keystoreProperties['storeFile'] ?: defaultKeystorePath
def keystoreFile = file(resolvedKeystorePath)
def keyAliasValue = keystoreProperties['keyAlias'] ?: System.getenv('PELIS_KEY_ALIAS')
def keyPasswordValue = keystoreProperties['keyPassword'] ?: System.getenv('PELIS_KEY_PASSWORD')
def storePasswordValue = keystoreProperties['storePassword'] ?: System.getenv('PELIS_STORE_PASSWORD')

android {
    namespace "mx.creapolis.peliculas"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // Configuración para soporte de 16KB page size
    // AGP 8.5.1+ soporta 16KB automáticamente con useLegacyPackaging = false
    packagingOptions {
        jniLibs {
            // false = usa uncompressed native libs con 16KB alignment (recomendado)
            // Requiere AGP 8.5.1+ para zipalign automático en 16KB
            useLegacyPackaging = false
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "mx.creapolis.peliculas"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // Configuración NDK para arquitecturas específicas
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // Configuración de splits para diferentes arquitecturas
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }

    signingConfigs {
        release {
            if (keystoreFile.exists() && keyAliasValue && keyPasswordValue && storePasswordValue) {
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
                storeFile keystoreFile
                storePassword storePasswordValue
            }
        }
    }

    buildTypes {
        release {
            // Use release signing if keystore exists, otherwise use debug
        signingConfig keystoreFile.exists() && keyAliasValue && keyPasswordValue && storePasswordValue
            ? signingConfigs.release
            : signingConfigs.debug
            
            // Optimizaciones para release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Configuraciones adicionales para 16KB page size
            // Remover configuración NDK para evitar conflictos con stripping
        }
        debug {
            // Configuraciones para debug
            minifyEnabled false
            debuggable true
            // Configuración NDK removida para evitar conflictos
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    
    // Firebase dependencies
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
}
