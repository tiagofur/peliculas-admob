org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
android.enableJetifier=true

# Nota: el soporte de 16KB page size viene de AGP 9 + useLegacyPackaging=false
# en app/build.gradle, no de flags. (android.enableR8* y android.enableD8* se
# eliminaron en AGP 7/8 y rompen el build si se declaran.)

# Configuraciones para bibliotecas nativas
android.bundle.language.enableSplit=true
android.bundle.density.enableSplit=true
android.bundle.abi.enableSplit=true

# Configuraciones de compilación
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.caching=true

# (Flags experimentales de R8 removidos: obsoletos en AGP 9.)
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
