org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
android.enableJetifier=true

# Configuraciones para soporte de 16KB page size
android.enableR8.fullMode=true
android.enableR8=true

# Optimizaciones adicionales
android.enableD8.desugaring=true
android.enableIncrementalDesugaring=true

# Configuraciones para bibliotecas nativas
android.bundle.language.enableSplit=true
android.bundle.density.enableSplit=true
android.bundle.abi.enableSplit=true

# Configuraciones de compilación
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.caching=true

# Configuraciones específicas para 16KB page size support
android.experimental.enableArtProfiles=true
android.experimental.r8.dex-startup-optimization=true
