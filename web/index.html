    <!-- Deep Links and App Detection Script -->
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        // Get current URL path
        const path = window.location.pathname;
        const fullUrl = window.location.href;

        console.log("Current path:", path);
        console.log("Full URL:", fullUrl);

        // Check if this is a share URL
        if (path.includes("/share")) {
          console.log("Share URL detected, attempting to open app...");

          // Extract the content path (movie, list, recommendation)
          let deepLinkPath = path.replace("/share", "");

          // Create deep link URL
          const deepLink = "peliculas://" + deepLinkPath.substring(1); // Remove leading slash

          console.log("Generated deep link:", deepLink);

          // Create a temporary link element
          const tempLink = document.createElement("a");
          tempLink.href = deepLink;
          tempLink.style.display = "none";
          document.body.appendChild(tempLink);

          // Try to open the app
          try {
            tempLink.click();
            console.log("Deep link clicked");
          } catch (e) {
            console.log("Error clicking deep link:", e);
          } finally {
            document.body.removeChild(tempLink);
          }

          // Fallback: redirect to main app route after a delay
          setTimeout(function () {
            // If we're still on the share page, redirect to the main app route
            if (window.location.pathname === path) {
              console.log("Redirecting to main app route:", deepLinkPath);
              window.location.href = deepLinkPath || "/";
            }
          }, 2000);
        }

        // Update meta tags for movie sharing if this is a movie page
        if (path.startsWith("/movie/") && !path.includes("/share")) {
          const movieId = path.split("/")[2];
          if (movieId) {
            updateMovieMetaTags(movieId);
          }
        }
      });

      // Function to update meta tags for better movie sharing
      function updateMovieMetaTags(movieId) {
        // This will be called by the Flutter app to update meta tags
        // The actual implementation will be handled by the Flutter web app
        console.log("Movie page detected for ID:", movieId);
      }

      // Function to update meta tags dynamically (can be called from Flutter)
      window.updatePageMetaTags = function (title, description, imageUrl, url) {
        // Update title
        if (title) {
          document.title = title;
          document.getElementById("page-title").textContent = title;
          document.getElementById("og-title").setAttribute("content", title);
          document
            .getElementById("twitter-title")
            .setAttribute("content", title);
        }

        // Update description
        if (description) {
          document
            .querySelector('meta[name="description"]')
            .setAttribute("content", description);
          document
            .getElementById("og-description")
            .setAttribute("content", description);
          document
            .getElementById("twitter-description")
            .setAttribute("content", description);
        }

        // Update image
        if (imageUrl) {
          document.getElementById("og-image").setAttribute("content", imageUrl);
          document
            .getElementById("twitter-image")
            .setAttribute("content", imageUrl);
        }

        // Update URL
        if (url) {
          document.getElementById("og-url").setAttribute("content", url);
          document.getElementById("twitter-url").setAttribute("content", url);
        }
      };

      // Function to detect if app is installed (best effort)
      window.checkAppInstallation = function () {
        return new Promise((resolve) => {
          const deepLink = "peliculas://check";
          const tempLink = document.createElement("a");
          tempLink.href = deepLink;
          tempLink.style.display = "none";
          document.body.appendChild(tempLink);

          const startTime = Date.now();

          // Create a blur event listener to detect app opening
          const onBlur = function () {
            const elapsed = Date.now() - startTime;
            if (elapsed > 1000) {
              resolve(true); // App likely opened
            }
          };

          window.addEventListener("blur", onBlur);

          try {
            tempLink.click();
          } catch (e) {
            console.log("Error testing app installation:", e);
          }

          // Clean up after 3 seconds
          setTimeout(() => {
            window.removeEventListener("blur", onBlur);
            document.body.removeChild(tempLink);
            resolve(false); // App likely not installed
          }, 3000);
        });
      };
    </script>

    <style id="splash-screen-style">
      html {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100%;
        background-color: #eebeb8;
        background-size: 100% 100%;
        /* Configuración de fuentes para Web con fallbacks completos */
        font-family: "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
          "Helvetica Neue", sans-serif;
      }

      /* Configuración específica para soporte de emojis y caracteres especiales */
      * {
        font-family: "Noto Sans", "Noto Color Emoji", "Noto Emoji",
          "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif !important;
      }

      .center {
        margin: 0;
        position: absolute;
        top: 50%;
        left: 50%;
        -ms-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
      }

      .contain {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .stretch {
        display: block;
        width: 100%;
        height: 100%;
      }

      .cover {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .bottom {
        position: absolute;
        bottom: 0;
        left: 50%;
        -ms-transform: translate(-50%, 0);
        transform: translate(-50%, 0);
      }

      .bottomLeft {
        position: absolute;
        bottom: 0;
        left: 0;
      }

      .bottomRight {
        position: absolute;
        bottom: 0;
        right: 0;
      }
    </style>
    <script id="splash-screen-script">
      function removeSplashFromWeb() {
        console.log("🎬 Removing splash screen from web");
        document.getElementById("splash")?.remove();
        document.getElementById("splash-branding")?.remove();
        document.body.style.background = "transparent";
        console.log("✅ Web splash screen removed");
      }

      // ✅ AUTO TIMEOUT: Remover splash screen automáticamente después de 5 segundos
      // para evitar que se quede congelado
      let splashTimeout = setTimeout(() => {
        console.log("⏰ Auto-removing splash screen due to timeout");
        removeSplashFromWeb();
      }, 5000);

      // Función para cancelar el timeout si la app se inicializa correctamente
      window.cancelSplashTimeout = function () {
        if (splashTimeout) {
          clearTimeout(splashTimeout);
          splashTimeout = null;
          console.log("✅ Splash timeout cancelled - app initialized properly");
        }
      };

      // Detectar cuando Flutter está listo
      window.addEventListener("flutter-initialized", () => {
        console.log("🚀 Flutter initialized event received");
        window.cancelSplashTimeout();
        // Dar un pequeño delay para asegurar que la UI esté lista
        setTimeout(() => {
          removeSplashFromWeb();
        }, 100);
      });
    </script>
