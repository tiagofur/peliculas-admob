name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.2.3)'
        required: true
        type: string

jobs:
  build_and_release:
    name: Build & Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 'stable'
        cache: true
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Run quality checks
      run: |
        # Ensure quality before release
        dart format --output=none --set-exit-if-changed .
        flutter analyze --fatal-infos --fatal-warnings
        flutter test --coverage
        
    - name: Build Web Release
      run: |
        flutter build web --release --dart-define=FLUTTER_WEB_USE_SKIA=true
        tar -czf web-release.tar.gz -C build/web .
        
    - name: Build Android APK
      run: |
        flutter build apk --release
        
    - name: Build Android App Bundle
      run: |
        flutter build appbundle --release
        
    - name: Prepare release artifacts
      run: |
        mkdir -p release-artifacts
        cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/
        cp build/app/outputs/bundle/release/app-release.aab release-artifacts/
        cp web-release.tar.gz release-artifacts/
        
    - name: Create Release Notes
      id: release_notes
      run: |
        # Extract version from tag or input
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
        fi
        
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        
        # Generate release notes
        cat > release_notes.md << EOF
        ## 🚀 Release $VERSION
        
        ### ✨ What's New
        - [Auto-generated release notes will be added here]
        
        ### 📱 Downloads
        - **Android APK**: app-release.apk
        - **Android Bundle**: app-release.aab (for Play Store)
        - **Web**: web-release.tar.gz
        
        ### 🔧 Technical Details
        - Flutter version: $(flutter --version | head -1)
        - Build date: $(date)
        - Commit: ${{ github.sha }}
        
        ### ✅ Quality Checks
        - All tests passed ✅
        - Code analysis clean ✅
        - Formatting verified ✅
        EOF
        
    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.VERSION }}
        release_name: Release ${{ env.VERSION }}
        body_path: release_notes.md
        draft: false
        prerelease: false
        
    - name: Upload APK to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: release-artifacts/app-release.apk
        asset_name: peliculas-${{ env.VERSION }}.apk
        asset_content_type: application/vnd.android.package-archive
        
    - name: Upload AAB to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: release-artifacts/app-release.aab
        asset_name: peliculas-${{ env.VERSION }}.aab
        asset_content_type: application/octet-stream
        
    - name: Upload Web Build to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: release-artifacts/web-release.tar.gz
        asset_name: peliculas-web-${{ env.VERSION }}.tar.gz
        asset_content_type: application/gzip