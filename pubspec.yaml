name: peliculas
description: Aplicacion de Peliculas.
publish_to: "none"
version: 1.2.1+6

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  animate_do: ^4.2.0
  web: ^1.0.0
  animations: ^2.0.11
  cached_network_image: ^3.4.1
  card_swiper: ^3.0.1
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8 # Added for iOS-style icons
  dio: ^5.7.0
  fl_chart: ^1.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_in_app_pip: ^1.7.4
  flutter_local_notifications: ^19.4.2
  flutter_native_splash: ^2.4.2
  flutter_riverpod: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^16.1.0
  google_mobile_ads: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.0.0
  image_cropper: ^9.1.0
  flutter_image_compress: ^2.1.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  share_plus: ^12.0.0
  url_launcher: ^6.3.2
  uuid: ^4.4.0
  youtube_player_flutter: ^9.1.2
  # Firebase dependencies
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  firebase_crashlytics: ^5.0.1
  timezone: ^0.10.1
  # Supabase dependencies
  supabase_flutter: ^2.9.1
  http: ^1.1.0
  logging: ^1.2.0
  path_provider: ^2.1.1
  crypto: ^3.0.3
  confetti: ^0.8.0
  lottie: ^3.3.1
  json_annotation: ^4.8.1
  equatable: ^2.0.7
  # Phase 3 Performance & Caching
  flutter_cache_manager: ^3.4.1
  shimmer: ^3.0.0
  # Phase 3 Animations & UX
  flutter_animate: ^4.5.0
  # Phase 3 Monetization
  in_app_purchase: ^3.2.1
  # Phase 3 Advanced UI
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  analyzer: ^6.4.1
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # golden_toolkit: ^0.15.0  # REMOVED: Package discontinued
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0
  integration_test:
    sdk: flutter
  mockito: ^5.4.4

  supabase: any
flutter_native_splash:
  color: "#EEBEB8"
  image: web/icons/Icon-192.png
  web: true

  android_12:
    color: "#EEBEB8"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/loaders/

  fonts:
    - family: NotoSans
      fonts:
        - asset: fonts/NotoSans-Regular.ttf
        - asset: fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoColorEmoji
      fonts:
        - asset: fonts/NotoColorEmoji.ttf
