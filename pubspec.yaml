name: peliculas
description: Aplicacion de Peliculas.
publish_to: "none"
version: 1.3.0+7

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  animate_do: ^5.1.0
  web: ^1.1.2
  cached_network_image: ^4.0.6
  card_swiper: ^3.0.1
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_in_app_pip: ^1.7.5
  flutter_local_notifications: ^22.3.3
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.3
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^18.1.3
  google_mobile_ads: ^9.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.4
  image_cropper: ^13.0.0
  flutter_image_compress: ^2.5.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  youtube_player_flutter: ^10.0.1
  # Firebase dependencies
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  firebase_crashlytics: ^6.0.1
  timezone: ^0.11.2
  # Supabase dependencies
  supabase_flutter: ^2.18.3
  http: ^1.6.0
  logging: ^1.2.0
  google_sign_in: ^7.2.0
  path_provider: ^2.1.6
  crypto: ^3.0.8
  confetti: ^0.8.0
  equatable: ^3.0.0
  # Phase 3 Performance & Caching
  flutter_cache_manager: ^3.5.0
  shimmer: ^4.0.0 # Task 2.5: Skeleton loaders

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # golden_toolkit: ^0.15.0  # REMOVED: Package discontinued
  hive_generator: ^2.0.1
  integration_test:
    sdk: flutter
  mockito: ^5.4.4

  supabase: ^2.16.5

flutter_native_splash:
  color: "#000000"
  image: web/icons/Icon-192.png
  web: true

  android_12:
    color: "#000000"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/loaders/
    - assets/images/

  fonts:
    - family: NotoSans
      fonts:
        - asset: fonts/NotoSans-Regular.ttf
        - asset: fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoColorEmoji
      fonts:
        - asset: fonts/NotoColorEmoji.ttf
