        LSApplicationQueriesSchemes:
          - netflix
          - aiv
          - disneyplus
          - hbomax
          - hulu
          - paramountplus
          - youtube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  PeliculasNative:
    build:
      targets:
        PeliculasNative: all
        PeliculasNativeTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      targets:
        - PeliculasNativeTests
    archive:
      config: Release
