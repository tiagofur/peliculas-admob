name: PeliculasNative
options:
  bundleIdPrefix: mx.creapolis.peliculas
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: $(MARKETING_VERSION)
    CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  PeliculasWidget:
    type: app-extension
    platform: iOS
    sources: [PeliculasWidget]
    info:
      path: PeliculasWidget/Info.plist
      properties:
        CFBundleDisplayName: Películas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en, pt-BR]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        API_BASE_URL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"   # solo iPhone (XcodeGen pone 1,2 por defecto)
  PeliculasNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PeliculasNativeTests
      - path: Products.storekit
        buildPhase: resources
    dependencies:
      - target: PeliculasNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # XCTest solo existe para iOS 17+; la app sigue en iOS 15.
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  PeliculasNative:
    type: application
    platform: iOS
    sources:
      - path: PeliculasNative
    dependencies:
      - target: PeliculasWidget
    entitlements:
      path: PeliculasNative/PeliculasNative.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ["applinks:peliculas.creapolis.dev"]
        aps-environment: $(APS_ENVIRONMENT)
    info:
      path: PeliculasNative/Info.plist
      properties:
        CFBundleDisplayName: Películas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en, pt-BR]
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        API_BASE_URL: $(API_BASE_URL)
        PRIVACY_URL: $(PRIVACY_URL)
        TERMS_URL: $(TERMS_URL)
        SUPPORT_URL: $(SUPPORT_URL)
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID).deeplink
            CFBundleURLSchemes:
              - peliculas
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationQueriesSchemes:
          - netflix
          - aiv
          - disneyplus
          - hbomax
          - hulu
          - paramountplus
          - youtube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"   # solo iPhone (XcodeGen pone 1,2 por defecto)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  PeliculasNative:
    build:
      targets:
        PeliculasNative: all
        PeliculasNativeTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      targets:
        - PeliculasNativeTests
    archive:
      config: Release
  # Capturas para App Store: Release (API de producción) con -screenshots.
  Capturas:
    build:
      targets:
        PeliculasNative: all
    run:
      config: Release
      commandLineArguments:
        "-screenshots": true
      storeKitConfiguration: Products.storekit
