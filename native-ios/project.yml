name: PeliculasNative
options:
  bundleIdPrefix: mx.creapolis.peliculas
  developmentLanguage: es
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "27.0"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: $(MARKETING_VERSION)
    CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  PeliculasWidget:
    type: app-extension
    platform: iOS
    sources: [PeliculasWidget]
    info:
      path: PeliculasWidget/Info.plist
      properties:
        CFBundleDisplayName: Películas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en, pt-BR]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        API_BASE_URL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
  PeliculasNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PeliculasNativeTests
      - path: Products.storekit
        buildPhase: resources
    dependencies:
      - target: PeliculasNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        # XCTest solo existe para iOS 17+; la app sigue en iOS 15.
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  PeliculasNative:
    type: application
    platform: iOS
    sources:
      - path: PeliculasNative
    dependencies:
      - target: PeliculasWidget
      - package: GoogleMobileAds
    entitlements:
      path: PeliculasNative/PeliculasNative.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: $(APS_ENVIRONMENT)
    info:
      path: PeliculasNative/Info.plist
      properties:
        CFBundleDisplayName: Películas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en, pt-BR]
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        API_BASE_URL: $(API_BASE_URL)
        PRIVACY_URL: $(PRIVACY_URL)
        TERMS_URL: $(TERMS_URL)
        SUPPORT_URL: $(SUPPORT_URL)
        GADApplicationIdentifier: $(GAD_APPLICATION_ID)
        GADAdUnitID: $(GAD_AD_UNIT_ID)
        NSUserTrackingUsageDescription: Usamos este permiso solo para que los anuncios de la versión gratis sean más relevantes. Con Pro no hay anuncios.
