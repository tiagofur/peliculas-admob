# Plesk → Sitios web y dominios → api-peliculas.creapolis.dev
#   → Configuración de Apache y nginx
#   1. Desmarca "Modo proxy" (así nginx atiende solo y no choca el "location /").
#   2. Pega esto en "Directivas adicionales de nginx" y guarda.
# El puerto debe coincidir con API_PORT del .env del servidor (8787 por defecto).

location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 4m;
}

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
