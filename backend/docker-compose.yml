# Local: `docker compose up --build` → http://localhost:8080
# VPS:   set DOMAIN in .env and add `--profile prod` to also start Caddy (HTTPS).
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://peliculas:${POSTGRES_PASSWORD:-peliculas}@db:5432/peliculas?sslmode=disable
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: peliculas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peliculas}
      POSTGRES_DB: peliculas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peliculas"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    profiles: [prod]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

volumes:
  pgdata:
  caddy_data:
